name: plan

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Print OIDC claims shape
        run: |
          set -euo pipefail
          RESP=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          TOKEN=$(printf '%s' "$RESP" | jq -r .value)
          python3 -c '
import json,base64,re,sys
tok=sys.argv[1]
payload=tok.split(".")[1]+"="*(-len(tok.split(".")[1])%4)
claims=json.loads(base64.urlsafe_b64decode(payload))
def scrub(v):
  return re.sub(r"\d{4,}","N",v) if isinstance(v,str) else v
keys=("iss","aud","sub","repository","repository_id","repository_owner","repository_owner_id","ref","job_workflow_ref","workflow_ref")
print(json.dumps({k:scrub(claims[k]) for k in keys if k in claims}, indent=2))
' "$TOKEN"

      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Show the assumed identity
        run: aws sts get-caller-identity
