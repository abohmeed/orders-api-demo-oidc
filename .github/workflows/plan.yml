name: plan

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Print OIDC claims shape
        run: |
          set -euo pipefail
          RESP=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          echo "$RESP" | jq -r .value | cut -d. -f2 | awk '{while(length($0)%4){$0=$0"="}; print}' | base64 -d 2>/dev/null | jq '{iss,aud,sub,repository,ref,job_workflow_ref}' | sed -E 's/[0-9]{4,}/N/g'

      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Show the assumed identity
        run: aws sts get-caller-identity
